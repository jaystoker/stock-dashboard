<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data:; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="자동매매">
  <meta name="description" content="내 자동매매 계좌 상태와 설정 요청 (개인용)">
  <title>내 자동매매</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-maskable-512.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="topbar">
    <div class="topbar-title">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <div>
        <h1>내 자동매매</h1>
        <p id="updated-text" class="sub">불러오는 중…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="mode-chip" class="chip" hidden></span>
      <span id="offline-chip" class="chip chip-offline" hidden>오프라인</span>
      <button id="refresh-btn" class="icon-btn" type="button" aria-label="새로고침">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <div id="pull-indicator" class="pull" aria-hidden="true">
    <span class="pull-spinner"></span><span id="pull-text">당겨서 새로고침</span>
  </div>

  <div id="banner" class="banner" hidden></div>

  <main id="main" class="main">
    <section id="panel-summary" class="panel" role="tabpanel" aria-labelledby="tab-summary" tabindex="-1"></section>
    <section id="panel-charts" class="panel" role="tabpanel" aria-labelledby="tab-charts" tabindex="-1" hidden></section>
    <section id="panel-holdings" class="panel" role="tabpanel" aria-labelledby="tab-holdings" tabindex="-1" hidden></section>
    <section id="panel-activity" class="panel" role="tabpanel" aria-labelledby="tab-activity" tabindex="-1" hidden></section>
    <section id="panel-backtest" class="panel" role="tabpanel" aria-labelledby="tab-backtest" tabindex="-1" hidden></section>
    <section id="panel-settings" class="panel" role="tabpanel" aria-labelledby="tab-settings" tabindex="-1" hidden></section>
    <noscript><p class="card">이 앱은 자바스크립트가 필요합니다.</p></noscript>
  </main>

  <nav class="tabbar" role="tablist" aria-label="화면">
    <button id="tab-summary" class="tab" type="button" role="tab" aria-controls="panel-summary" aria-selected="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span>요약</span>
    </button>
    <button id="tab-charts" class="tab" type="button" role="tab" aria-controls="panel-charts" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 16l5-6 4 3 7-8"/></svg>
      <span>차트</span>
    </button>
    <button id="tab-holdings" class="tab" type="button" role="tab" aria-controls="panel-holdings" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M8 6V4h8v2"/><path d="M3 12h18"/></svg>
      <span>보유</span>
    </button>
    <button id="tab-activity" class="tab" type="button" role="tab" aria-controls="panel-activity" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>내역</span>
    </button>
    <button id="tab-backtest" class="tab" type="button" role="tab" aria-controls="panel-backtest" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
      <span>백테스트</span>
    </button>
    <button id="tab-settings" class="tab" type="button" role="tab" aria-controls="panel-settings" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog" class="dialog-form">
      <h2 id="confirm-title" class="dialog-title"></h2>
      <div id="confirm-body" class="dialog-body"></div>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="btn" type="submit" value="cancel">취소</button>
        <button id="confirm-ok" class="btn primary" type="submit" value="ok">확인</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
